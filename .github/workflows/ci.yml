name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  desktop-swift:
    name: Desktop Swift (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
          - os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer

      - name: Install Swift toolchain (Linux)
        if: runner.os == 'Linux'
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3.3'

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  apple-simulators:
    name: Apple Platforms (${{ matrix.platform }})
    runs-on: xcode-27
    needs: desktop-swift
    strategy:
      fail-fast: false
      matrix:
        platform:
          - "iOS Simulator"
          - "tvOS Simulator"
          - "watchOS Simulator"
          - "visionOS Simulator"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild \
            -scheme Commander \
            -destination "generic/platform=${{ matrix.platform }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build
